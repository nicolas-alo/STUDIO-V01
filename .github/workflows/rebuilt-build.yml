name: Clean rebuild - build

on:
  push:
    branches:
      - rebuild/clean-compositor-core
    paths:
      - 'src/Studio.Rebuilt/**'
      - '.github/workflows/rebuilt-build.yml'
  pull_request:
    paths:
      - 'src/Studio.Rebuilt/**'
      - '.github/workflows/rebuilt-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build clean project
        run: dotnet build src/Studio.Rebuilt/Studio.Rebuilt.csproj --configuration Release

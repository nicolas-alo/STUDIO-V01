name: Build STUDIO V01

concurrency:
  group: studio-v01-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore STUDIO-V01.sln
      - name: Build
        run: dotnet build STUDIO-V01.sln -c Release --no-restore
      - name: Publish
        run: dotnet publish src/Studio.UI/Studio.UI.csproj -c Release -r win-x64 --self-contained true -o publish
      - name: Download FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/tools | Out-Null
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extracted -Force
          $ffmpeg = Get-ChildItem -Path ffmpeg-extracted -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ffmpeg) { throw "ffmpeg.exe no encontrado." }
          Copy-Item $ffmpeg.FullName package/tools/ffmpeg.exe -Force
      - name: Assemble package
        shell: pwsh
        run: |
          Copy-Item publish/* package/ -Recurse -Force
          Copy-Item config/config.example.json package/config.local.json -Force
          Set-Content -Path package/LEER_PRIMERO.txt -Value @"
          STUDIO V01 - ETAPA 2 RECONSTRUIDA

          1. Abrí config.local.json.
          2. Reemplazá USUARIO:CONTRASENA por las credenciales reales de las 4 cámaras.
          3. M3U8 es opcional: completá m3u8Url si corresponde.
          4. Ejecutá Studio.UI.exe.

          El programa abre automáticamente y reproduce el ciclo cada 20 segundos.
          Los nombres PUENTE, PUERTO, ESQUINA, EDIFICIO JJ y 4 CÁMARAS también funcionan como selección manual.
          "@
      - name: Zip package
        shell: pwsh
        run: Compress-Archive -Path package/* -DestinationPath STUDIO-V01-ETAPA2-win-x64.zip -Force
      - name: Publish latest ZIP as GitHub Release asset
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          $repo = $env:GITHUB_REPOSITORY
          $tag = "latest-build"
          $api = "https://api.github.com/repos/$repo"
          $old = $null
          try { $old = Invoke-RestMethod -Headers $headers -Uri "$api/releases/tags/$tag" -Method Get } catch {}
          if ($old) {
            Invoke-RestMethod -Headers $headers -Uri "$api/releases/$($old.id)" -Method Delete
            try { Invoke-RestMethod -Headers $headers -Uri "$api/git/refs/tags/$tag" -Method Delete } catch {}
          }
          $releaseBody = @{
            tag_name = $tag
            target_commitish = $env:GITHUB_SHA
            name = "STUDIO V01 — última compilación"
            body = "Paquete compilado automáticamente desde el commit $env:GITHUB_SHA. Windows x64."
            draft = $false
            prerelease = $true
          } | ConvertTo-Json
          $release = Invoke-RestMethod -Headers $headers -Uri "$api/releases" -Method Post -Body $releaseBody -ContentType "application/json"
          $assetUri = "https://uploads.github.com/repos/$repo/releases/$($release.id)/assets?name=STUDIO-V01-latest-win-x64.zip"
          Invoke-RestMethod -Headers $headers -Uri $assetUri -Method Post -InFile "STUDIO-V01-ETAPA2-win-x64.zip" -ContentType "application/zip"
          Write-Host "Paquete publicado: $($release.html_url)"
